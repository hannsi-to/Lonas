name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI のランナーには GPU がないため、GPU を使うテストは飛ばす（GpuContext::new_headless）
  LONAS_SKIP_GPU_TESTS: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 新しいリリースで増えた lint で突然落ちないよう、手元と同じ版に固定する。上げるときは手元と揃えて変える
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
