[package]
name = "Lonas"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
log = "0.4.34"
naga = { version = "30", features = ["wgsl-in"] }

[features]
default = ["image"]
# PNG / JPEG の読み込み（ResourceManager::register_texture）。外すと register_texture_rgba のみ（§11 画像の形式）
# examples/test1.rs は DESIGN.md の API のサンプル。実装が追いつくまでビルドしない
api-sample = []
image = ["dep:image"]

[[example]]
name = "test1"
required-features = ["api-sample"]
