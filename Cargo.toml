[package]
name = "lonas"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
harfrust = { version = "0.15", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
log = "0.4.34"
lyon_tessellation = { version = "1.0.23", optional = true }
fdsm = { version = "0.8.0", optional = true }
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1.0.1"
raw-window-handle = "0.6"
skrifa = { version = "0.49", optional = true }
unicode-linebreak = { version = "0.1.5", optional = true }
zeno = { version = "0.3.3", optional = true }
wgpu = "30"

[features]
default = ["image", "text"]
# PNG / JPEG の読み込み（ResourceManager::register_texture）。外すと register_texture_rgba のみ（§11 画像の形式）
image = ["dep:image"]
# テキストの整形と描画（§13 Cargo の feature）。外すと ResourceConfig に text の項目がなくなる
text = ["dep:harfrust", "dep:skrifa", "dep:unicode-linebreak", "dep:lyon_tessellation", "dep:zeno"]
# Sdf / Msdf（§13 Cargo の feature）。fdsm と、その画像の型のための image（register_texture は image feature のまま）
msdf = ["text", "dep:fdsm", "dep:image"]

[dev-dependencies]
winit = "0.30"

# PNG の読み込み（register_texture）と TextConfig を使う
[[example]]
name = "test1"
required-features = ["image", "text"]

# フォントの登録と write_text を使う
[[example]]
name = "text"
required-features = ["text"]

# Bitmap（グリフのアトラス）を使う
[[example]]
name = "text_bitmap"
required-features = ["text"]

# Sdf / Msdf を使う
[[example]]
name = "text_sdf"
required-features = ["msdf"]
