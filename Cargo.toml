[package]
name = "lonas"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
log = "0.4.34"
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1.0.1"
raw-window-handle = "0.6"
wgpu = "30"

[features]
default = ["image"]
# PNG / JPEG の読み込み（ResourceManager::register_texture）。外すと register_texture_rgba のみ（§11 画像の形式）
image = ["dep:image"]

[dev-dependencies]
winit = "0.30"

# PNG の読み込み（register_texture）を使う
[[example]]
name = "test1"
required-features = ["image"]
